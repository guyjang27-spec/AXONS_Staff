<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาข้อมูลพนักงาน (Google Sheet)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse สำหรับแปลงไฟล์ CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">🔍 ค้นหาและกรองข้อมูลพนักงาน</h1>
            <p class="text-slate-500 mt-2">พิมพ์ค้นหาทั่วไป หรือเลือกตัวกรอง GP และตำแหน่งด้านล่าง</p>
        </div>

        <!-- Search Box & Filters Container -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-8 space-y-6">
            
            <!-- Global Search Box -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">ค้นหาทั่วไป (ชื่อ, อีเมล, Product ฯลฯ)</label>
                <div class="relative">
                    <input type="text" id="searchInput" oninput="filterEmployees()" 
                        placeholder="พิมพ์ค้นหาหลายเงื่อนไข เช่น ชิต distri chu..." 
                        class="w-full px-5 py-3 pl-12 rounded-xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-base bg-white">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Filter Section (GP & Position) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-100">
                
                <!-- GP Filter -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">กรองตาม GP</label>
                    <input type="text" id="gpSearch" oninput="updateGpCheckboxes()" placeholder="ค้นหา GP..." 
                        class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div id="gpCheckboxContainer" class="max-h-40 overflow-y-auto space-y-1.5 p-2 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                        <!-- รายการ Checkbox GP จะถูกสร้างอัตโนมัติ -->
                    </div>
                </div>

                <!-- Position Filter -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-slate-700">กรองตาม ตำแหน่ง</label>
                    <input type="text" id="posSearch" oninput="updatePosCheckboxes()" placeholder="ค้นหาตำแหน่ง..." 
                        class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div id="posCheckboxContainer" class="max-h-40 overflow-y-auto space-y-1.5 p-2 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                        <!-- รายการ Checkbox ตำแหน่ง จะถูกสร้างอัตโนมัติ -->
                    </div>
                </div>

            </div>

            <!-- Reset Button -->
            <div class="flex justify-end pt-2">
                <button onclick="resetFilters()" class="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium rounded-xl transition">
                    🔄 ล้างตัวกรองทั้งหมด
                </button>
            </div>
        </div>

        <!-- Status Loading -->
        <div id="loadingState" class="text-center text-slate-500 py-8">กำลังโหลดข้อมูลจาก Google Sheet...</div>

        <!-- Result Count -->
        <div id="resultCount" class="text-sm text-slate-500 mb-4 text-center"></div>

        <!-- Results Container -->
        <div id="resultContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12 bg-white rounded-2xl border border-slate-100 shadow-sm">
            <p class="text-slate-400 text-lg">ไม่พบข้อมูลพนักงานที่ค้นหา</p>
        </div>
    </div>

    <script>
        let employeeData = [];
        let uniqueGps = [];
        let uniquePositions = [];

        // ลิงก์ CSV จาก Google Sheet ของคุณ
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSt4DgynOH7qvZUgBPj6eL2TeddHfXM_yzRyl5L__gPVC_-iPfuCqhtYhfElvFA3hbUwLmDKw4LkX7y/pub?gid=0&single=true&output=csv';

        // โหลดข้อมูล CSV อัตโนมัติเมื่อเปิดเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    employeeData = results.data;
                    document.getElementById('loadingState').style.display = 'none';
                    
                    // รวบรวมรายชื่อ GP และ Position ทั้งหมดที่ไม่ซ้ำกัน
                    uniqueGps = [...new Set(employeeData.map(emp => emp['Function_Group_Name'] || '-'))].sort();
                    uniquePositions = [...new Set(employeeData.map(emp => emp['Position_Title_Job'] || '-'))].sort();

                    renderGpCheckboxes(uniqueGps);
                    renderPosCheckboxes(uniquePositions);
                    filterEmployees();
                },
                error: function(err) {
                    document.getElementById('loadingState').textContent = 'ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบลิงก์ Google Sheet';
                    console.error(err);
                }
            });
        });

        // สร้าง Checkbox GP
        function renderGpCheckboxes(gps) {
            const container = document.getElementById('gpCheckboxContainer');
            container.innerHTML = '';
            gps.forEach((gp, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center space-x-2";
                div.innerHTML = `
                    <input type="checkbox" id="gp_${index}" value="${gp}" onchange="filterEmployees()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                    <label for="gp_${index}" class="text-slate-700 truncate cursor-pointer text-xs" title="${gp}">${gp}</label>
                `;
                container.appendChild(div);
            });
        }

        // สร้าง Checkbox Position
        function renderPosCheckboxes(positions) {
            const container = document.getElementById('posCheckboxContainer');
            container.innerHTML = '';
            positions.forEach((pos, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center space-x-2";
                div.innerHTML = `
                    <input type="checkbox" id="pos_${index}" value="${pos}" onchange="filterEmployees()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                    <label for="pos_${index}" class="text-slate-700 truncate cursor-pointer text-xs" title="${pos}">${pos}</label>
                `;
                container.appendChild(div);
            });
        }

        // ฟังก์ชันกรองรายชื่อ GP ตามช่องพิมพ์ค้นหาเฉพาะ GP
        function updateGpCheckboxes() {
            const query = document.getElementById('gpSearch').value.toLowerCase();
            const filteredGps = uniqueGps.filter(gp => gp.toLowerCase().includes(query));
            renderGpCheckboxes(filteredGps);
        }

        // ฟังก์ชันกรองรายชื่อ Position ตามช่องพิมพ์ค้นหาเฉพาะ Position
        function updatePosCheckboxes() {
            const query = document.getElementById('posSearch').value.toLowerCase();
            const filteredPos = uniquePositions.filter(pos => pos.toLowerCase().includes(query));
            renderPosCheckboxes(filteredPos);
        }

        // ฟังก์ชันล้างตัวกรองทั้งหมด
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('gpSearch').value = '';
            document.getElementById('posSearch').value = '';
            renderGpCheckboxes(uniqueGps);
            renderPosCheckboxes(uniquePositions);
            
            // เคลียร์ค่า check ทุกตัว
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            filterEmployees();
        }

        function filterEmployees() {
            const rawQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const keywords = rawQuery.split(/[\s,]+/).filter(keyword => keyword.length > 0);

            // ดึง GP ที่ถูกติ๊กเลือก
            const selectedGps = Array.from(document.querySelectorAll('#gpCheckboxContainer input[type="checkbox"]:checked')).map(cb => cb.value);
            
            // ดึง ตำแหน่ง ที่ถูกติ๊กเลือก
            const selectedPositions = Array.from(document.querySelectorAll('#posCheckboxContainer input[type="checkbox"]:checked')).map(cb => cb.value);

            const filtered = employeeData.filter(emp => {
                const empGp = emp['Function_Group_Name'] || '-';
                const empPos = emp['Position_Title_Job'] || '-';

                // 1. เงื่อนไข GP Checkbox (ถ้ามีการติ๊ก จะต้องตรงกับอย่างน้อย 1 ในที่ติ๊ก)
                if (selectedGps.length > 0 && !selectedGps.includes(empGp)) {
                    return false;
                }

                // 2. เงื่อนไข Position Checkbox (ถ้ามีการติ๊ก จะต้องตรงกับอย่างน้อย 1 ในที่ติ๊ก)
                if (selectedPositions.length > 0 && !selectedPositions.includes(empPos)) {
                    return false;
                }

                // 3. เงื่อนไข Search ทั่วไป (Multi-keyword AND)
                if (keywords.length > 0) {
                    const fullRowText = Object.values(emp).join(' ').toLowerCase();
                    const matchesAllKeywords = keywords.every(keyword => fullRowText.includes(keyword));
                    if (!matchesAllKeywords) return false;
                }

                return true;
            });

            renderEmployees(filtered);
        }

        function renderEmployees(data) {
            const container = document.getElementById('resultContainer');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('resultCount');
            
            container.innerHTML = '';
            
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                resultCount.textContent = '';
                return;
            }

            emptyState.classList.add('hidden');
            resultCount.textContent = `พบข้อมูลทั้งหมด ${data.length} รายการ`;

            data.forEach(emp => {
                const nickname = emp['ชื่อเล่น'] || '-';
                const tNamekey = emp['T-namekey'] || '-';
                const namekey = emp['NAMEKEY'] || '-';
                const position = emp['Position_Title_Job'] || '-';
                const gp = emp['Function_Group_Name'] || '-';
                const product = emp['Product'] || '-';
                const email = emp['Email_Address_Business_Email_Information'] || '-';
                const mobile = emp['Phone_Number'] || '-';

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-6 border border-slate-100 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="text-xl font-bold text-slate-800">${tNamekey}</h3>
                            <span class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full">ชื่อเล่น: ${nickname}</span>
                        </div>
                        <p class="text-xs text-slate-400 font-mono mb-2">EN: ${namekey}</p>
                        
                        <div class="mb-4 text-sm font-medium text-indigo-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                            💼 ${position}
                        </div>
                        
                        <div class="space-y-2 text-sm border-t border-slate-100 pt-3">
                            <div class="flex justify-between">
                                <span class="text-slate-500 font-medium">GP:</span>
                                <span class="text-slate-700 text-right font-medium">${gp}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500 font-medium">Product:</span>
                                <span class="text-slate-700 text-right">${product}</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 space-y-1.5 text-sm">
                        <div class="flex items-center text-slate-600">
                            <svg class="w-4 h-4 mr-2 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            <a href="mailto:${email}" class="truncate text-indigo-600 hover:underline">${email}</a>
                        </div>
                        <div class="flex items-center text-slate-600">
                            <svg class="w-4 h-4 mr-2 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            <a href="tel:${mobile}" class="text-indigo-600 hover:underline">${mobile}</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
